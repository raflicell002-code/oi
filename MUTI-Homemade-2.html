<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MUTI Homemade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Konsep: aplikasi kasir satu kolom untuk HP, navigasi bawah, kartu produk bergambar, biru dominan dengan aksen pink */
:root{
  --bg:#f1f5fd; --surface:#ffffff; --surface2:#e7eefc; --fg:#14213d; --muted:#586583; --line:#d8e1f4;
  --blue:#1d4ed8; --blue-ink:#ffffff; --blue-soft:#dde7fd;
  --pink:#e0457c; --pink-soft:#fde2ed;
  --good:#117a58; --good-soft:#d6f2e6; --warn:#9a5700; --warn-soft:#fdebc8; --bad:#bd242b; --bad-soft:#fddfe0;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --navh:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1122; --surface:#131b33; --surface2:#1a2444; --fg:#e8edfb; --muted:#98a5c6; --line:#27325a;
    --blue:#6f96ff; --blue-ink:#0a1230; --blue-soft:#1e2b57; --pink:#ff7aa8; --pink-soft:#3a1a2b;
    --good:#4fd1a1; --good-soft:#12362c; --warn:#f0b24d; --warn-soft:#3a2c10; --bad:#ff8a90; --bad-soft:#3b1a1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1122; --surface:#131b33; --surface2:#1a2444; --fg:#e8edfb; --muted:#98a5c6; --line:#27325a;
  --blue:#6f96ff; --blue-ink:#0a1230; --blue-soft:#1e2b57; --pink:#ff7aa8; --pink-soft:#3a1a2b;
  --good:#4fd1a1; --good-soft:#12362c; --warn:#f0b24d; --warn-soft:#3a2c10; --bad:#ff8a90; --bad-soft:#3b1a1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;text-wrap:balance}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--navh) + 36px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top svg{width:38px;height:38px;flex:none}
.top img.logo{width:38px;height:38px;border-radius:10px;object-fit:contain;flex:none;background:var(--surface)}
.logo-prev{width:72px;height:72px;border-radius:16px;overflow:hidden;background:var(--surface2);flex:none;display:grid;place-items:center}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.logo-prev svg{width:56px;height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.2px;color:var(--blue);line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.page-h h1{font-size:1.55rem}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
section{margin-bottom:22px}
.sec-t{font-family:var(--f-display);font-size:1.08rem;margin:0 0 10px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.r{text-align:right}
.num{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid3.pc{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* tombol */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);text-align:center}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.88rem;border-radius:12px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5}
:is(button,a,input,select,textarea,summary):focus-visible{outline:3px solid var(--pink);outline-offset:2px}
/* form */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;min-height:48px;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:1rem}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{border-color:var(--blue);outline:none}
.money{position:relative}
.money:before{content:'Rp';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:.9rem}
.money .inp{padding-left:40px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:5px;border-radius:14px}
.seg button{min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--blue);color:var(--blue-ink);box-shadow:0 1px 3px rgba(20,33,61,.18)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.86rem;cursor:pointer;color:var(--fg)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.pink{background:var(--pink-soft);color:var(--pink)}
/* kartu angka */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.stat .l{font-size:.8rem;font-weight:700;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:1.28rem;margin-top:3px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.stat.hero{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);grid-column:1/-1}
.stat.hero .l{color:inherit;opacity:.85}
.stat.hero .v{font-size:1.9rem}
.stat.pk .v{color:var(--pink)}
.banner{background:var(--pink-soft);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.banner p{margin:0;font-size:.88rem;flex:1;min-width:200px}
/* produk */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.pimg{aspect-ratio:4/3;max-width:100%;background:var(--blue-soft);overflow:hidden}
.pimg img,.pimg svg{width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.pname{font-weight:700;font-size:.92rem;line-height:1.25}
.pprice{font-family:var(--f-display);font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-top:auto}
.step button{height:44px;border-radius:12px;border:0;background:var(--blue-soft);color:var(--blue);font-size:1.4rem;font-weight:700;cursor:pointer;line-height:1}
.step button.plus{background:var(--blue);color:var(--blue-ink)}
.step b{text-align:center;font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.gh{font-family:var(--f-display);font-weight:600;margin:14px 0 8px;color:var(--muted);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.bar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 8px);z-index:15;background:var(--blue);color:var(--blue-ink);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;box-shadow:0 6px 20px rgba(20,33,61,.25)}
.bar .t{font-family:var(--f-display);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar .btn{background:var(--surface);color:var(--blue);border-color:var(--surface)}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line.big{font-family:var(--f-display);font-size:1.2rem;font-weight:600}
.line.bad{color:var(--bad);font-weight:700}
.line.good{color:var(--good);font-weight:700}
/* tabel */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;background:var(--surface2)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px;background:var(--surface)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.rank{display:flex;flex-direction:column;gap:12px}
.rank .it .top2{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.rank .meter{height:8px;border-radius:99px;background:var(--surface2);margin-top:6px;overflow:hidden}
.rank .meter i{display:block;height:100%;background:var(--blue);border-radius:99px}
.rank .it:first-child .meter i{background:var(--pink)}
.po-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.po-chip{flex:none;max-width:230px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.po-chip.on{border-color:var(--blue);background:var(--blue-soft)}
.po-chip b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
.mrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left;cursor:pointer;font-weight:500}
.mrow .ic{width:46px;height:46px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center;font-size:1.4rem;flex:none}
.mrow b{display:block;font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--blue-soft);flex:none}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block}
details.cust{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.cust summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.cust summary::-webkit-details-marker{display:none}
/* nav bawah */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{min-height:54px;border:0;background:transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.nav button span{font-size:1.3rem;line-height:1}
.nav button.on{background:var(--blue-soft);color:var(--blue)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,18,40,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h3{font-size:1.2rem}
.x{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface2);font-size:1.2rem;cursor:pointer}
.receipt{background:var(--surface);border:1px dashed var(--muted);border-radius:14px;padding:16px}
.receipt .rh{text-align:center;margin-bottom:10px}
.receipt .rh b{font-family:var(--f-display);font-size:1.3rem;color:var(--blue);letter-spacing:.06em}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
textarea.manual{width:100%;min-height:200px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px;font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:.9rem;max-width:90%;text-align:center}
.photo-row{display:flex;gap:12px;align-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var KEY='muti_homemade_v1';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad=function(n){return String(n).padStart(2,'0')};
var rp=function(n){return 'Rp'+Math.round(n||0).toLocaleString('id-ID')};
var num=function(s){return parseInt(String(s==null?'':s).replace(/\D/g,''),10)||0};
var uid=function(){return Math.random().toString(36).slice(2,9)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function parseD(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtDate(s){if(!s)return '-';return parseD(s).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
function fmtShort(s){if(!s)return '-';return parseD(s).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}
function daysTo(s){var a=parseD(todayStr()),b=parseD(s);return Math.round((b-a)/86400000)}

/* ---------- data ---------- */
var storageOk=true;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){storageOk=false}
var CATS={donat:'Donat',bolu:'Bolu',bolen:'Bolen',dimsum:'Dimsum Mentai',dimsum_moza:'Dimsum + Moza',lain:'Lainnya'};
function seed(){
  var P=[
    ['Donat 3 pcs',15000,'box','donat'],['Donat 6 pcs',30000,'box','donat'],['Donat 12 pcs',55000,'box','donat'],
    ['Bolu Ketan Item',40000,'','bolu'],['Bolen',27000,'box','bolen'],
    ['Dimsum Mentai isi 4',20000,'box','dimsum'],['Dimsum Mentai isi 6',25000,'box','dimsum'],['Dimsum Mentai isi 8',30000,'box','dimsum'],
    ['Dimsum Mentai + Moza isi 4',25000,'box','dimsum_moza'],['Dimsum Mentai + Moza isi 6',30000,'box','dimsum_moza'],['Dimsum Mentai + Moza isi 8',35000,'box','dimsum_moza'],
    ['Dimsum Goreng Moza isi 5',25000,'box','dimsum_moza']
  ].map(function(r,i){return {id:'p'+(i+1),name:r[0],price:r[1],unit:r[2],cat:r[3],photo:'',active:true}});
  var by=function(n){return P.filter(function(p){return p.name===n})[0]};
  var it=function(n,q){var p=by(n);return {pid:p.id,name:p.name,price:p.price,qty:q,unit:p.unit}};
  var mk=function(seq,nama,wa,alamat,tgl,items,paid){return {id:uid(),seq:seq,no:'PO-'+pad3(seq),nama:nama,wa:wa,alamat:alamat,catatan:'',tglPesan:tgl,tglAmbil:'2026-10-10',poId:'po1',items:items,diskon:0,ongkir:0,payments:paid?[{date:tgl,amount:paid}]:[],sample:true}};
  return {
    settings:{nama:'Muti Homemade',wa:'',alamat:'',penutup:'Terima kasih ❤️'},
    products:P,
    pos:[{id:'po1',title:'Open PO Donat & Dimsum',periode:'1–8 Oktober 2026',tutup:'2026-10-08',produksi:'2026-10-09',ambil:'2026-10-10',status:'OPEN',sample:true}],
    orders:[
      mk(1,'Andi','081234567801','Jl. Melati No. 4','2026-10-01',[it('Donat 12 pcs',1)],55000),
      mk(2,'Siti','081234567802','Jl. Kenanga No. 12','2026-10-02',[it('Dimsum Mentai isi 8',2)],30000),
      mk(3,'Budi','081234567803','Jl. Mawar No. 7','2026-10-03',[it('Bolen',1)],0)
    ]
  };
}
function pad3(n){return String(n).padStart(3,'0')}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.products)&&Array.isArray(s.orders))return s}catch(e){}
  return seed();
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Penyimpanan penuh. Hapus foto produk yang besar atau salin cadangan data.')}}
if(!S.pos)S.pos=[];if(!S.settings)S.settings={nama:'Muti Homemade',wa:'',alamat:'',penutup:'Terima kasih ❤️'};

function calc(o){
  var sub=0,qty=0;o.items.forEach(function(i){sub+=i.price*i.qty;qty+=i.qty});
  var total=Math.max(0,sub-(o.diskon||0)+(o.ongkir||0));
  var paid=0;(o.payments||[]).forEach(function(p){paid+=p.amount});
  var sisa=Math.max(0,total-paid);
  var status=(total>0&&paid<total)?(paid>0?'DP':'Belum Bayar'):'Lunas';
  return {sub:sub,qty:qty,total:total,paid:paid,sisa:sisa,status:status};
}
function custKey(o){var d=(o.wa||'').replace(/\D/g,'');return d||('n:'+o.nama.trim().toLowerCase())}
function totalsOf(list){
  var t={omzet:0,paid:0,sisa:0,qty:0,orders:list.length,cust:0},set={};
  list.forEach(function(o){var c=calc(o);t.omzet+=c.total;t.paid+=Math.min(c.paid,c.total);t.sisa+=c.sisa;t.qty+=c.qty;set[custKey(o)]=1});
  t.cust=Object.keys(set).length;return t;
}
function prodStats(list){
  var m={};
  list.forEach(function(o){o.items.forEach(function(i){var k=i.pid||i.name;if(!m[k])m[k]={name:i.name,unit:i.unit||'',qty:0,rev:0};m[k].name=i.name;m[k].qty+=i.qty;m[k].rev+=i.qty*i.price})});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.qty-a.qty});
}
function pill(st){return '<span class="pill '+(st==='Lunas'?'good':st==='DP'?'warn':'bad')+'">'+esc(st)+'</span>'}

/* ---------- Kasir ---------- */
function kitems(){
  var out=[];
  Object.keys(draft.qty).forEach(function(pid){
    var q=draft.qty[pid];if(!(q>0))return;
    var p=S.products.filter(function(x){return x.id===pid})[0];
    var price=draft.prices[pid]!=null?draft.prices[pid]:(p?p.price:0);
    var name=draft.names[pid]||(p?p.name:'Produk');
    var unit=draft.units[pid]!=null?draft.units[pid]:(p?p.unit:'');
    out.push({pid:pid,name:name,price:price,qty:q,unit:unit});
  });
  return out;
}
function kcalc(){
  var items=kitems(),sub=0,qty=0;items.forEach(function(i){sub+=i.price*i.qty;qty+=i.qty});
  var diskon=num(draft.diskon),ongkir=num(draft.ongkir),total=Math.max(0,sub-diskon+ongkir);
  var dp=Math.min(num(draft.dp),total);
  var bayar=draft.status==='Lunas'?total:draft.status==='DP'?dp:0;
  var dit=draft.diterima===''?null:num(draft.diterima);
  var need=draft.status==='Belum Bayar'?0:bayar;
  var kembali=dit==null?0:dit-need;
  var kurang=dit!=null&&need>0&&dit<need;
  return {items:items,sub:sub,qty:qty,diskon:diskon,ongkir:ongkir,total:total,bayar:bayar,sisa:Math.max(0,total-bayar),dit:dit,kembali:kembali,kurang:kurang,need:need};
}

function saveOrder(){
  var c=kcalc();
  if(!draft.nama.trim()){toast('Isi nama pelanggan dulu');var n=$('#f-nama');if(n)n.focus();return}
  if(!c.items.length){toast('Pilih minimal satu produk');return}
  if(draft.status==='DP'&&c.bayar<=0){toast('Isi jumlah DP');return}
  if(draft.status==='DP'&&num(draft.dp)>c.total){toast('DP tidak boleh melebihi total')}
  if(c.kurang){toast('Uang diterima kurang dari yang harus dibayar');return}
  var o;
  var payments=c.bayar>0?[{date:draft.tglPesan||todayStr(),amount:c.bayar}]:[];
  if(draft.editId){
    o=S.orders.filter(function(x){return x.id===draft.editId})[0];
    if(!o){toast('Pesanan tidak ditemukan');return}
  }else{
    var seq=S.orders.reduce(function(a,x){return Math.max(a,x.seq||0)},0)+1;
    o={id:uid(),seq:seq,no:'PO-'+pad3(seq)};S.orders.push(o);
  }
  o.nama=draft.nama.trim();o.wa=draft.wa.trim();o.alamat=draft.alamat.trim();o.catatan=draft.catatan.trim();
  o.tglPesan=draft.tglPesan||todayStr();o.tglAmbil=draft.tglAmbil;o.poId=draft.poId||'';
  o.items=c.items;o.diskon=c.diskon;o.ongkir=c.ongkir;o.payments=payments;delete o.sample;
  var wasEdit=!!draft.editId;
  save();draft=newDraft();render();window.scrollTo(0,0);
  toast(wasEdit?'Perubahan '+o.no+' tersimpan':'Pesanan '+o.no+' tersimpan');
  showReceipt(o.id);
}

function poStats(p){
  var os=S.orders.filter(function(o){return o.poId===p.id});
  return {os:os,T:totalsOf(os),ps:prodStats(os)};
}
function filterOrders(list,f){
  var q=(f.q||'').toLowerCase().trim(),qd=q.replace(/\D/g,'');
  return list.filter(function(o){
    var c=calc(o);
    if(f.fs&&c.status!==f.fs)return false;
    if(f.date&&o.tglPesan!==f.date)return false;
    if(f.ppo){var p=poOf(o);if(!p||p.status!==f.ppo)return false}
    if(q){
      var hay=(o.nama+' '+o.no+' '+o.items.map(function(i){return i.name}).join(' ')).toLowerCase();
      var wa=qd.length>=3&&(o.wa||'').replace(/\D/g,'').indexOf(qd)>-1;
      if(hay.indexOf(q)<0&&!wa)return false;
    }
    return true;
  }).sort(function(a,b){return a.seq-b.seq});
}

/* ---------- Rekap ---------- */
function periodOf(s,mode){
  var d=parseD(s);
  if(mode==='harian')return {key:s,label:fmtDate(s)};
  if(mode==='mingguan'){var wd=(d.getDay()+6)%7,a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd),b=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd+6);return {key:ymd(a),label:fmtShort(ymd(a))+' – '+fmtShort(ymd(b))}}
  return {key:d.getFullYear()+'-'+pad(d.getMonth()+1),label:d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
}
function rekapRows(){

function rekapTSV(){
  var rows=rekapRows(),T=totalsOf(S.orders);

  rows.forEach(function(r){L.push([r.label,r.T.orders,r.T.qty,r.T.omzet,r.T.paid,r.T.sisa].join('\t'))});
  L.push(['TOTAL',T.orders,T.qty,T.omzet,T.paid,T.sisa].join('\t'));
  L.push('');L.push('Produk\tTerjual\tPendapatan');
  prodStats(S.orders).forEach(function(p){L.push([p.name,p.qty,p.rev].join('\t'))});

function resizeImg(file,cb,png,maxPx){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var max=maxPx||480,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.72));
  };im.onerror=function(){toast('Foto tidak bisa dibaca')};im.src=r.result};
  r.readAsDataURL(file);
}

  'pr-del':function(b){var p=S.products.filter(function(x){return x.id===b.dataset.id})[0];if(!p)return;confirmBox('Hapus produk?','<b>'+esc(p.name)+'</b> akan dihapus dari daftar. Pesanan lama tetap menyimpan nama dan harganya.','pr-del-yes','Ya, hapus',p.id)},
  'pr-del-yes':function(b){var id=b.dataset.id;S.products=S.products.filter(function(p){return p.id!==id});delete draft.qty[id];save();closeModal();render();toast('Produk dihapus')},
  'set-save':function(){
    var n=$('#s-nama').value.trim();if(!n){toast('Nama usaha tidak boleh kosong');return}
    S.settings={logo:S.settings.logo||'',pin:S.settings.pin||'',nama:n,wa:$('#s-wa').value.trim(),alamat:$('#s-alamat').value.trim(),penutup:$('#s-penutup').value.trim()||'Terima kasih ❤️'};
    save();renderChrome();toast('Pengaturan tersimpan');
  },
  'bk-copy':function(){copyText(JSON.stringify(S),'Cadangan tersalin. Simpan di tempat aman')},
  'bk-restore':function(){
    try{var x=JSON.parse($('#s-restore').value);if(!x||!Array.isArray(x.products)||!Array.isArray(x.orders))throw 0;S=x;if(!S.pos)S.pos=[];save();draft=newDraft();ui.selPo=null;render();toast('Data berhasil dipulihkan')}
    catch(e){toast('Teks cadangan tidak valid')}
  },
  'del-sample':function(){confirmBox('Hapus data contoh?','Pesanan dan Open PO contoh akan dihapus. Data yang Anda buat sendiri tetap aman.','del-sample-yes','Ya, hapus')},
  'del-sample-yes':function(){S.orders=S.orders.filter(function(o){return !o.sample});S.pos=S.pos.filter(function(p){return !p.sample});if(!S.pos.some(function(p){return p.id===draft.poId}))draft.poId='';ui.selPo=null;save();closeModal();render();toast('Data contoh dihapus')},
  'reset-all':function(){confirmBox('Hapus semua data?','Semua pesanan, Open PO, produk, dan pengaturan akan dihapus permanen. Salin cadangan dulu jika masih perlu.','reset-yes','Ya, hapus semua')},
  'reset-yes':function(){S=seed();S.orders=[];S.pos=[];draft=newDraft();ui.selPo=null;save();closeModal();go('dashboard');toast('Data dihapus. Aplikasi siap dipakai dari awal')}
};
document.addEventListener('click',function(e){
  var m=$('#modal');
  if(e.target===m){closeModal();return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var f=A[b.dataset.act];if(f){e.preventDefault();f(b,e)}
});
var I={
  k:function(t){
    var f=t.dataset.f;
    if(f==='diskon'||f==='ongkir'||f==='dp'||f==='diterima'){var n=num(t.value);t.value=n?n.toLocaleString('id-ID'):'';draft[f]=n?String(n):'';refreshKasir();return}
    draft[f]=t.value;
    if(f==='poId'){var p=S.pos.filter(function(x){return x.id===t.value})[0];if(p&&p.ambil){draft.tglAmbil=p.ambil;var i=$('#f-tglAmbil');if(i)i.value=p.ambil}}
  },
  money:function(t){var n=num(t.value);t.value=n?n.toLocaleString('id-ID'):''},
  flt:function(t){ui[t.dataset.g][t.dataset.f]=t.value;var l=$('#list');if(l)l.innerHTML=lists[({po:'po',by:'bayar',cu:'cust'})[t.dataset.g]]()}
};
document.addEventListener('input',function(e){var t=e.target,k=t.dataset&&t.dataset.in;if(k&&I[k])I[k](t)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='pr-file'&&t.files&&t.files[0]){resizeImg(t.files[0],function(url){ui.pform.photo=url;$('#pr-thumb').innerHTML='<img src="'+url+'" alt="Foto produk">'})}
  if(t.id==='s-logo-file'&&t.files&&t.files[0]){resizeImg(t.files[0],function(url){S.settings.logo=url;save();render();toast('Logo diganti')},true,256)}
  if(t.dataset&&t.dataset.pphoto&&t.files&&t.files[0]){var pid=t.dataset.pphoto;resizeImg(t.files[0],function(url){var p=S.products.filter(function(x){return x.id===pid})[0];if(p){p.photo=url;save();render();toast('Foto '+p.name+' diganti')}})}
  if(t.id==='pr-cat'&&!ui.pform.photo){$('#pr-thumb').innerHTML=art(t.value)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){var f=A[e.target.dataset.enter];if(f){e.preventDefault();f()}}
});

selPo();render();
})();
</script>
